<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Web Weather</title>
    <link rel="stylesheet" href="style.CSS">
</head>
<body>
    <div class= "weather-title">
        <div class="cloud" style="top: 10px; animation-duration: 14s;"></div>
        <div class="cloud" style="top: 50px; animation-duration: 20s; animation-delay: -8s; transform: scale(0.7);"></div>
        <div class="cloud" style="top: 5px; animation-duration: 10s; animation-delay: -3s; transform: scale(0.85);"></div>
        <div class="cloud" style="top: 25px; animation-duration: 20s; animation-delay: -6s; transform: scale(0.9);"></div>
        <div class="cloud" style="top: 3px; animation-duration: 23s; animation-delay: -10s; transform: scale(0.4);"></div>
        <div class="maintitle">
            <h1>Web Weather</h1>
        </div>
        <input class="search-box" type="text" placeholder="🔍 Search City">
    </div>
</body>

</html>
